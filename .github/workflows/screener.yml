# Runs the screener every weekday morning and publishes the result to GitHub Pages.
# 매일 평일 아침 스크리너를 실행하고 결과를 GitHub Pages에 올립니다.
name: Daily screener

on:
  schedule:
    - cron: "50 22 * * 0-4"   # 22:50 UTC Sun-Thu = 06:50 SGT Mon-Fri (GitHub may start a bit late)
  workflow_dispatch:           # "Run workflow" button for a manual run / 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: screener-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate investment app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DISABLE_SCHEDULER: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: investment/requirements.txt
      - name: Install test dependencies
        run: pip install -r investment/requirements.txt pytest httpx
      - name: Test investment app
        run: python -m pytest -q

  run:
    name: Build and deploy from default branch
    needs: validate
    # Evaluate before entering the protected github-pages environment.
    # Manual runs on development branches validate only; they never deploy or push reports.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Singapore                                   # file date = Singapore date
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}        # empty -> AI comments skipped
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Week number (for Naver theme cache)
        id: wk
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore Naver theme cache
        uses: actions/cache@v5
        with:
          path: naver_themes.json
          key: naver-themes-${{ steps.wk.outputs.week }}
          restore-keys: naver-themes-

      - name: Run screener
        run: python screener.py --themes --news --ai

      - name: Restore investment DB (keeps news history)
        uses: actions/cache@v5
        with:
          path: investment/data
          key: invest-db-${{ github.run_id }}
          restore-keys: invest-db-

      - name: Run investment idea pipeline
        continue-on-error: true          # never blocks the screener report
        working-directory: investment
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          pip install -r requirements.txt
          python -m app.pipeline all --export ../docs/invest/index.html

      - name: Build site
        run: python make_site.py

      - name: Save reports to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Report $(date +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v5
